<!DOCTYPE html>
<html lang="en" data-api-mock="true" data-api-base="https://handynaija-app.onrender.com">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request a service — HandyNaija</title>
  <meta name="description" content="Send a service request to a provider: describe the job, choose a location and pick a preferred time.">
  <meta name="theme-color" content="#0b6e4f">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="request-service" data-header="customer" data-auth="customer">
  <a class="skip-link" href="#main">Skip to main content</a>

  <div data-site-header></div>

  <main id="main" class="page-main">
    <div class="container container--narrow">
      <p style="margin-bottom: var(--space-4)">
        <a class="btn btn--ghost btn--sm" href="services.html">
          <span aria-hidden="true"></span> Back to search
        </a>
      </p>

      <div class="page-head">
        <div class="page-head__text">
          <p class="eyebrow">New request</p>
          <h1 class="h1">Request a service</h1>
          <p class="text-small text-muted">
            The provider gets your request straight away. Nothing is booked until they accept it.
          </p>
        </div>
      </div>

      <!-- Form is built by requests.js -->
      <div class="card card--padded" data-booking-root>
        <p class="text-small text-muted">Preparing the form…</p>
      </div>
    </div>
  </main>

  <div data-site-footer></div>

  <script src="js/boot-guard.js"></script>

  <script type="module" src="js/pages/request-service.js"></script>
</body>
</html>
